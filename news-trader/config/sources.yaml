# News sources. Add, remove or disable feeds here - no code changes needed.
# Check them with:  python -m newsbot check-sources
#
# NOTE: these URLs could not be tested from the environment this was built in.
# Run check-sources on your server and disable any that fail.
#  - Reuters closed its public RSS feeds (around 2020, as far as I know).
#  - Bloomberg / FT / AP: paywalled or no official public RSS that I can confirm;
#    entries are included disabled - enable only if check-sources succeeds and
#    your use complies with their terms.
#
# Fields: name, type (rss | gdelt | newsapi), url (rss), query (gdelt/newsapi),
#         publisher (display name), reliability (optional override, 0-1), enabled

sources:
  - name: cnbc_top_news
    type: rss
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    publisher: CNBC
  - name: aljazeera_all
    type: rss
    url: https://www.aljazeera.com/xml/rss/all.xml
    publisher: Al Jazeera
  - name: coindesk
    type: rss
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    publisher: CoinDesk
  - name: cointelegraph
    type: rss
    url: https://cointelegraph.com/rss
    publisher: Cointelegraph
  - name: bloomberg_markets
    type: rss
    url: https://feeds.bloomberg.com/markets/news.rss
    publisher: Bloomberg
    enabled: false
  - name: ft_markets
    type: rss
    url: https://www.ft.com/markets?format=rss
    publisher: Financial Times
    enabled: false
  - name: gdelt_crypto_macro
    type: gdelt                 # free; GDELT updates about every 15 minutes
    query: '(bitcoin OR ethereum OR crypto OR "federal reserve" OR inflation OR "interest rate")'
    publisher: GDELT
  - name: newsapi_crypto
    type: newsapi               # needs NEWSAPI_KEY; the free plan delays articles (check newsapi.org/pricing)
    query: 'bitcoin OR ethereum OR crypto OR "federal reserve"'
    publisher: NewsAPI
    enabled: false

# Reliability by publisher domain (0-1). Articles from domains not listed here
# get scoring.default_reliability. These are starting values - tune them.
publisher_reliability:
  reuters.com: 0.95
  bloomberg.com: 0.95
  apnews.com: 0.9
  ft.com: 0.9
  wsj.com: 0.9
  cnbc.com: 0.8
  bbc.co.uk: 0.85
  bbc.com: 0.85
  aljazeera.com: 0.75
  coindesk.com: 0.7
  theblock.co: 0.7
  cointelegraph.com: 0.6
