# Copy to config/settings.yaml and edit.  python -m newsbot run

# paper   = real prices, simulated money, no API keys, no orders on any exchange  <- default
# testnet = Binance testnet (exchange-side paper money; needs testnet API keys)
# live    = REAL MONEY. Also requires NEWSBOT_CONFIRM_LIVE=YES in .env
mode: paper

exchange: binance
quote_currency: USDT
database_url: sqlite:///data/newsbot.db   # or postgresql+psycopg://user:pass@host/db
tick_seconds: 15          # how often prices, positions and the kill switch are checked
news_poll_seconds: 120    # how often news sources are polled (60-300)

news:
  max_age_minutes: 30     # stories older than this are ignored (likely priced in)
  dedup_window_hours: 6
  dedup_similarity: 0.6   # 0-1: how similar two headlines must be to count as one event

analysis:
  engine: claude          # claude (needs ANTHROPIC_API_KEY) | keyword (free, crude baseline)
  model: claude-opus-5-5
  effort: low             # low is enough for classifying news; raise if quality needs it
  max_calls_per_day: 500  # hard cost cap
  prefilter: true         # only send stories mentioning a tracked asset or macro keyword

scoring:
  default_reliability: 0.5          # publishers not listed in sources.yaml
  confirmation_weights: [0.85, 0.925, 1.0]   # 1 source, 2 sources, 3+ sources

signals:
  min_confidence: 0.75              # weighted confidence needed to trade
  min_independent_sources: 2        # different publishers that must report the story
  entry_limit_offset_pct: 0.0005    # limit order 0.05% through the last price
  entry_timeout_seconds: 120        # cancel entry orders that haven't filled
  confirmation:                     # the market must agree before trading
    timeframe: 1m
    momentum_bars: 15
    min_momentum_pct: 0.002         # moved 0.2% in the signal's direction over 15 bars
    volume_recent_bars: 5
    volume_lookback_bars: 60
    min_volume_ratio: 1.5           # last 5 bars' volume >= 1.5x the previous 60 bars' average
    require_momentum: true
    require_volume: true

risk:
  starting_cash: 10000              # paper account
  max_risk_per_trade_pct: 0.01      # lose at most 1% of equity if a stop-loss hits
  max_total_exposure_pct: 0.20      # all open positions together <= 20% of equity
  max_daily_loss_pct: 0.03          # down 3% today -> close everything, stop until tomorrow
  max_trades_per_day: 10
  allow_short: false                # spot crypto can't short; bearish news only closes longs
  min_order_notional: 10
  day_timezone: UTC
  horizons:                         # stop-loss / take-profit / max hold by expected impact horizon
    minutes: {stop_loss_pct: 0.01, take_profit_pct: 0.02, max_hold_minutes: 60}
    hours:   {stop_loss_pct: 0.02, take_profit_pct: 0.04, max_hold_minutes: 480}
    days:    {stop_loss_pct: 0.04, take_profit_pct: 0.08, max_hold_minutes: 4320}
  session:                          # crypto is 24/7, so this is off; enable for stock markets
    enabled: false
    timezone: America/New_York
    open: "09:30"
    close: "16:00"
    weekdays: [0, 1, 2, 3, 4]       # Monday=0
    no_trade_open_minutes: 5
    no_trade_close_minutes: 5

costs:
  fee_rate: 0.001                   # 0.1% per trade; check your fee tier
  slippage: 0.0005

alerts:
  telegram: false                   # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env
  email: false                      # needs SMTP_* settings in .env
  error_cooldown_minutes: 15

paths:
  kill_file: data/KILL
  log_file: logs/newsbot.log
  paper_state: data/paper_state.json
